server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Ảnh sản phẩm tải lên tối đa vài MB.
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Trợ lý AI ráp máy gửi từng bước theo luồng (NDJSON): không gom phản hồi, chờ lâu hơn mặc định 60 giây.
  location = /api/v1/builder/agent {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 150s;
  }

  # Đấu giá: luồng giá trực tiếp (Server-Sent Events) giữ kết nối lâu, không gom phản hồi.
  location ~ ^/api/v1/auctions/[0-9]+/events$ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
  }

  # /health (tiến trình còn chạy) và /health/ready (SQL Server + MongoDB ổn) cho dịch vụ theo dõi uptime.
  location /health {
    proxy_pass http://backend:3000;
  }

  # File build của Vite có hash trong tên nên cache lâu được.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
